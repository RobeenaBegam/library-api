<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Library Manager</h1>

    <form id="book-form">
      <input type="number" id="book-id" placeholder="ID" required>
      <input type="text" id="book-title" placeholder="Title" required>
      <input type="text" id="book-author" placeholder="Author" required>
      <button type="submit" class="add-btn">Add Book</button>
    </form>

    <div id="message"></div>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Author</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="book-table"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
